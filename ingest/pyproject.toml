[project]
name = "lol-ingest"
version = "0.1.0"
description = "Data ingestion, normalization and validation for Legends of League"
license = "MIT"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.11",
]

[project.scripts]
lol-ingest = "lol_ingest.cli:main"

[dependency-groups]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lol_ingest"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# Pydantic copies field defaults per instance, so `= []` on model fields is safe.
"src/lol_ingest/models/*" = ["RUF012"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
