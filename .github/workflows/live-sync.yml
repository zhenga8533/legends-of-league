name: Live sync

# Keeps editions marked `status: live` or `upcoming` in data/editions.yaml up to date: upcoming
# ones show their schedule and go live with their first result. Runs every 30 minutes, but
# imports that often only while an edition is live or due to start; editions that are only
# upcoming are imported once a day (06:07 UTC), sparing Leaguepedia weeks of identical queries.
on:
  schedule:
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: live-sync
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
      pull-requests: read
    outputs:
      sync: ${{ steps.live.outputs.live == 'true' && steps.due.outputs.due == 'true' && steps.pending.outputs.pending != 'true' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Any live or upcoming editions?
        id: live
        run: |
          if grep -qE '^\s+status: (live|upcoming)\s*$' data/editions.yaml; then
            echo "live=true" >> "$GITHUB_OUTPUT"
          else
            echo "No live or upcoming editions; nothing to do."
          fi
      - name: Due for an import?
        id: due
        if: steps.live.outputs.live == 'true'
        env:
          EVENT: ${{ github.event_name }}
        run: |
          today=$(date -u +%F)
          # Imported editions record their status and dates; a draft not imported yet has neither.
          due_now='map(select(.status == "live" or (.status == "upcoming" and (.dates.start // "9999") <= $today)))'
          frequent=$(jq -rs --arg today "$today" "$due_now | length" data/tournaments/*/*/edition.json)
          if [[ "$EVENT" == workflow_dispatch || "$frequent" != 0 ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
          elif [[ "$(date -u +%H)" == 06 && "$(date -u +%M)" -lt 30 ]]; then
            echo "due=true" >> "$GITHUB_OUTPUT"
            echo "Daily import of upcoming editions."
          else
            echo "Only upcoming editions, not started yet; they're imported daily at 06:07 UTC."
          fi
      # A finished edition's PR waits for review; a new sync would supersede (close) it.
      - name: Waiting on a finished edition?
        id: pending
        if: steps.live.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label edition-completed \
            --json url --jq '.[].url')
          if [[ -n "$prs" ]]; then
            echo "pending=true" >> "$GITHUB_OUTPUT"
            echo "Paused until this is reviewed: $prs"
          fi
      # Auto-merges are made with the default token, whose pushes don't trigger the deploy
      # workflow, so the latest main is deployed from here.
      - name: Deploy main if it hasn't been
        if: steps.live.outputs.live == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          head=$(git rev-parse HEAD)
          deployed=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow deploy.yml --branch main \
            --limit 1 --json headSha --jq '.[0].headSha // ""')
          if [[ "$deployed" != "$head" ]]; then
            gh workflow run deploy.yml --repo "$GITHUB_REPOSITORY" --ref main
            echo "Dispatched a deploy of $head."
          fi

  sync:
    needs: check
    if: needs.check.outputs.sync == 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/ingest.yml
    with:
      tournament: all
      year: all
      operation: refresh
      status: active
      auto_merge: true
    secrets: inherit
