name: Data import

on:
  workflow_dispatch:
    inputs:
      tournament:
        description: Tournament
        type: choice
        options: [worlds, msi, first-stand, all]
        default: worlds
      year:
        description: Year (e.g. 2024) or "all"
        type: string
        default: all
      operation:
        description: "dry-run: report only · import: write changes · refresh: re-fetch and write · validate: check committed data · lineage: group teams into organizations · discover: draft upcoming editions (lineage and discover ignore tournament, year, status)"
        type: choice
        options: [dry-run, import, refresh, validate, lineage, discover]
        default: dry-run
      provider:
        description: Data provider
        type: choice
        options: [auto, leaguepedia]
        default: auto
      force:
        description: Apply changes to verified records and removals
        type: boolean
        default: false
      force_confirmation:
        description: 'With force, type "overwrite verified data" to confirm'
        type: string
        default: ""
      status:
        description: Only editions with this status (active = live or upcoming, what the live sync imports)
        type: choice
        options: [all, active, live, completed, upcoming]
        default: all
      auto_merge:
        description: Auto-merge the PR once CI passes, if the report marks it safe
        type: boolean
        default: false
  # The live sync calls this with status "active"; the weekly discovery with operation "discover".
  workflow_call:
    inputs:
      tournament: { type: string, default: all }
      year: { type: string, default: all }
      operation: { type: string, default: refresh }
      provider: { type: string, default: auto }
      force: { type: boolean, default: false }
      force_confirmation: { type: string, default: "" }
      status: { type: string, default: all }
      auto_merge: { type: boolean, default: false }

permissions:
  contents: read

concurrency:
  group: ingest-${{ inputs.tournament }}-${{ inputs.year }}-${{ inputs.status }}
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      pull-requests: write
      # Approves CI runs on the data PR.
      actions: write
    env:
      TOURNAMENT: ${{ inputs.tournament }}
      YEAR: ${{ inputs.year }}
      OPERATION: ${{ inputs.operation }}
      PROVIDER: ${{ inputs.provider }}
      FORCE: ${{ inputs.force }}
      STATUS: ${{ inputs.status }}
    steps:
      - name: Validate inputs
        env:
          CONFIRMATION: ${{ inputs.force_confirmation }}
        run: |
          if [[ "$YEAR" != all && ! "$YEAR" =~ ^20[0-9]{2}$ ]]; then
            echo "::error::year must be 'all' or a four-digit year, got '$YEAR'"; exit 1
          fi
          if [[ "$FORCE" == true && "$CONFIRMATION" != "overwrite verified data" ]]; then
            echo "::error::force requires force_confirmation = 'overwrite verified data'"; exit 1
          fi
          if [[ ! "$STATUS" =~ ^(all|active|live|completed|upcoming)$ ]]; then
            echo "::error::unknown status '$STATUS'"; exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The PR step pushes with its own token; a persisted checkout token would override it.
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: true
      - run: uv sync --locked
        working-directory: ingest

      # Provider responses are deliberately not cached between runs, so every import sees
      # the provider's current data.
      - name: Run lol-ingest
        id: ingest
        working-directory: ingest
        env:
          LEAGUEPEDIA_BOT_USER: ${{ secrets.LEAGUEPEDIA_BOT_USER }}
          LEAGUEPEDIA_BOT_PASSWORD: ${{ secrets.LEAGUEPEDIA_BOT_PASSWORD }}
        run: |
          if [[ "$OPERATION" == lineage ]]; then
            args=(lineage --write)
          elif [[ "$OPERATION" == discover ]]; then
            args=(discover --write)
          else
            args=(run --tournament "$TOURNAMENT" --year "$YEAR" --op "$OPERATION" --provider "$PROVIDER" --status "$STATUS")
            if [[ "$FORCE" == true ]]; then args+=(--force); fi
          fi
          set +e
          uv run lol-ingest "${args[@]}"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Job summary
        if: always()
        run: |
          if [[ -f .cache/reports/report.md ]]; then cat .cache/reports/report.md >> "$GITHUB_STEP_SUMMARY"; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: ingest-${{ github.run_id }}
          path: |
            .cache/reports
            .cache/leaguepedia
          if-no-files-found: ignore
          retention-days: 30

      - name: Detect data changes
        id: changes
        if: steps.ingest.outputs.exit_code == '0' && (inputs.operation == 'import' || inputs.operation == 'refresh' || inputs.operation == 'lineage' || inputs.operation == 'discover')
        run: |
          # Discovery drafts rulesets too.
          if [[ -n "$(git status --porcelain -- data rulesets)" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "No data changes; nothing to propose."
          fi

      # CI runs on PRs opened with the default GITHUB_TOKEN wait for approval; a GitHub App
      # token avoids that, and without one the runs are approved below.
      - name: GitHub App token
        id: app-token
        if: steps.changes.outputs.changed == 'true' && vars.DATA_BOT_APP_ID != ''
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.DATA_BOT_APP_ID }}
          private-key: ${{ secrets.DATA_BOT_PRIVATE_KEY }}

      - name: Open pull request
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
          HAS_APP_TOKEN: ${{ steps.app-token.outputs.token != '' }}
          RUN_ID: ${{ github.run_id }}
          AUTO_MERGE: ${{ inputs.auto_merge }}
        run: |
          # Live syncs get their own branch prefix, so they only supersede each other.
          if [[ "$OPERATION" == lineage || "$OPERATION" == discover ]]; then slug="$OPERATION"
          elif [[ "$STATUS" == all ]]; then slug="${TOURNAMENT}-${YEAR}"
          elif [[ "$STATUS" == active ]]; then slug=live
          else slug="${STATUS}"; fi
          # "auto" resolves to a concrete provider; name the one actually used.
          used=$(jq -r '[.editions[].provider // empty] | unique | join(",")' .cache/reports/report.json)
          branch="data/${slug}-${RUN_ID}"
          git config user.name "legends-of-league-data[bot]"
          git config user.email "legends-of-league-data@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git switch -c "$branch"
          git add data rulesets
          git commit -m "data(${slug}): ${OPERATION} from ${used}"
          git push -u origin "$branch"

          labels=(data)
          if [[ "$(jq '.forced' .cache/reports/report.json)" != 0 ]]; then labels+=(modifies-verified); fi
          if [[ "$(jq '.blocked' .cache/reports/report.json)" != 0 ]]; then labels+=(blocked-changes); fi
          if [[ "$(jq '.completed | length' .cache/reports/report.json)" != 0 ]]; then labels+=(edition-completed); fi
          if [[ "$(jq '.drafted // [] | length' .cache/reports/report.json)" != 0 ]]; then labels+=(new-edition); fi
          for label in "${labels[@]}"; do gh label create "$label" --force >/dev/null; done

          {
            echo "Automated \`${OPERATION}\` of \`${slug}\` from \`${used}\` ([workflow run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}))."
            echo
            head -c 60000 .cache/reports/report.md
          } > pr-body.md
          url=$(gh pr create --base main --head "$branch" \
            --title "data(${slug}): ${OPERATION} from ${used}" \
            --body-file pr-body.md $(printf -- '--label %s ' "${labels[@]}"))
          echo "Opened $url"

          # Only the PR's own pull_request runs count as its required checks (a dispatched run
          # on the same commit does not), so approve those once they appear.
          if [[ "$HAS_APP_TOKEN" != true ]]; then
            sha=$(git rev-parse HEAD)
            approved=false
            for _ in $(seq 12); do
              ids=$(gh run list --branch "$branch" --event pull_request --json databaseId,headSha,conclusion \
                --jq ".[] | select(.headSha == \"$sha\" and .conclusion == \"action_required\") | .databaseId")
              if [[ -n "$ids" ]]; then
                for id in $ids; do
                  gh api -X POST "repos/${GITHUB_REPOSITORY}/actions/runs/${id}/approve" >/dev/null && approved=true
                done
                break
              fi
              sleep 10
            done
            if [[ "$approved" == true ]]; then
              echo "Approved CI on $url."
            else
              echo "::warning::Couldn't approve CI on $url; approve its run by hand."
            fi
          fi
          # Only additive, error-free imports merge themselves, and only after required CI passes.
          if [[ "$AUTO_MERGE" == true ]]; then
            if [[ "$(jq '.autoMergeSafe' .cache/reports/report.json)" == true ]]; then
              gh pr merge "$url" --auto --squash
            else
              echo "::warning::Not auto-merging: the report has errors, blocked or forced changes."
            fi
          fi

          # Older open PRs for the same selection are superseded by this one.
          gh pr list --state open --json number,headRefName \
            --jq ".[] | select(.headRefName | startswith(\"data/${slug}-\")) | select(.headRefName != \"${branch}\") | .number" |
          while read -r number; do
            gh pr close "$number" --delete-branch --comment "Superseded by $url"
          done

      - name: Fail if the import reported errors
        if: steps.ingest.outputs.exit_code != '0'
        run: |
          echo "::error::lol-ingest exited with ${{ steps.ingest.outputs.exit_code }}; see the job summary."
          exit 1
