name: Weekly upkeep

# Drafts registry entries for upcoming international events once Leaguepedia dates them, and
# groups rebranded teams into organizations from Leaguepedia's renames. Each opens a PR for
# review only when something changed. Also deletes branches left by auto-merged data PRs.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: discover
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      draft-pending: ${{ steps.pending.outputs.draft }}
      lineage-pending: ${{ steps.pending.outputs.lineage }}
    steps:
      # A PR under review may carry the reviewer's fixes; a new run would supersede (close) it.
      - name: PRs already under review?
        id: pending
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for pair in draft:new-edition lineage:lineage; do
            output=${pair%%:*}
            label=${pair#*:}
            prs=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --label "$label" \
              --json url --jq '.[].url')
            if [[ -n "$prs" ]]; then
              echo "${output}=true" >> "$GITHUB_OUTPUT"
              echo "Skipping $label until this is reviewed: $prs"
            fi
          done

  discover:
    needs: check
    if: needs.check.outputs.draft-pending != 'true'
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/ingest.yml
    with:
      operation: discover
    secrets: inherit

  # Data PRs merged by the default token keep their branches (GitHub's delete-on-merge doesn't
  # apply to them). Delete data branches without an open PR, once they're a day old so an
  # import opening its PR right now is never caught.
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: Delete finished data branches
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff=$(date -u -d '1 day ago' +%s)
          open=$(gh pr list --repo "$GITHUB_REPOSITORY" --state open --limit 200 \
            --json headRefName --jq '.[].headRefName')
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches" --jq '.[].name' |
          { grep '^data/' || true; } |
          while read -r branch; do
            if grep -qxF "$branch" <<< "$open"; then continue; fi
            updated=$(gh api "repos/$GITHUB_REPOSITORY/commits/$branch" --jq '.commit.committer.date')
            if (( $(date -u -d "$updated" +%s) > cutoff )); then continue; fi
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$branch"
            echo "Deleted $branch"
          done

  # After the discovery (run or skipped), so the two never push at once.
  lineage:
    needs: [check, discover]
    if: ${{ !cancelled() && needs.check.result == 'success' && needs.check.outputs.lineage-pending != 'true' }}
    permissions:
      contents: write
      pull-requests: write
      actions: write
    uses: ./.github/workflows/ingest.yml
    with:
      operation: lineage
    secrets: inherit
