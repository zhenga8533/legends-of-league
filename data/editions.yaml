# Registry of tournament editions and where each provider keeps their data.
# Adding an edition here is the first step to importing it (see docs/data-model.md).

editions:
  - tournament: worlds
    year: 2024
    name: 2024 World Championship
    status: completed
    stages:
      - { id: play-in, name: Play-In }
      - { id: swiss, name: Swiss Stage }
      - { id: knockout, name: Knockout Stage }
    leaguepedia:
      basePage: 2024 Season World Championship
      pages:
        - page: 2024 Season World Championship/Play-In
          stage: play-in
        - page: 2024 Season World Championship/Main Event
          tabs:
            "Round *": swiss
            "*": knockout

  - tournament: msi
    year: 2024
    name: 2024 Mid-Season Invitational
    status: completed
    stages:
      - { id: play-in, name: Play-In }
      - { id: bracket, name: Bracket Stage }
    leaguepedia:
      basePage: 2024 Mid-Season Invitational
      pages:
        - page: 2024 Mid-Season Invitational
          tabs:
            "Play-In*": play-in
            "*": bracket

  - tournament: first-stand
    year: 2025
    name: 2025 First Stand
    status: completed
    stages:
      - { id: groups, name: Group Stage }
      - { id: knockout, name: Knockout Stage }
    leaguepedia:
      basePage: 2025 First Stand
      pages:
        - page: 2025 First Stand
          tabs:
            "Groups*": groups
            "*": knockout
